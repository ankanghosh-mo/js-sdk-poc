server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The console uses hash routes (#/sdks/...), so every page is index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files carry a content hash in their name: cache them for long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
